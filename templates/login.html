<!DOCTYPE html>
<html>
<head>
    <title>College Chatbot Login</title>
    <style>
        body {
            background-color: #f4f6f7;
            font-family: 'Lucida cursive';
             background: url("{{ url_for('static', filename='bgg.jpeg') }}") no-repeat center center fixed;
        
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: white;
            background-image: url("{{ url_for('static', filename='gr.jpeg') }}");
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .signup-link {
            display: block;
            padding: 40px;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #272326;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>College Chatbot Login</h2>
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <a class="signup-link" href="/signup-student">Don't have an account? Sign Up</a>
    </div>
</body>
</html>
