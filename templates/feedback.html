<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='bg.jpeg') }}") no-repeat center center fixed;
            background-size: cover;
            padding: 50px;
        }
        .form-box {
            background-color: rgba(255,255,255,0.95);
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: none;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        h2 { text-align: center; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>📣 Student Feedback</h2>
        {% if message %}
            <p style="color: green;">{{ message }}</p>
        {% endif %}
        <form method="POST">
            <textarea name="feedback" placeholder="Write your feedback here..." required></textarea><br>
            <button type="submit">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
