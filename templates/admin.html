<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
          
            font-family: Arial, sans-serif;
            background-color: #9ccce4;
            padding: 20px;
        }
        .logout-btn {
            float: right;
            background-color: #dc35468f;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
        }
        form {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <a class="logout-btn" href="/logout">Logout</a>
    <h2>Admin Panel - Manage FAQs</h2>

    <form method="POST">
        <input type="text" name="question" placeholder="Enter question" required><br><br>
        <input type="text" name="answer" placeholder="Enter answer" required><br><br>
        <button type="submit">Add FAQ</button>
    </form>

    <h3>Existing FAQs</h3>
    <table border="1" cellpadding="10" cellspacing="0">
        <tr><th>Question</th><th>Answer</th></tr>
        {% for row in faqs %}
        <tr><td>{{ row['question'] }}</td><td>{{ row['answer'] }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
